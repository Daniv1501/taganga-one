spring:
  application:
    name: taganga-one

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taganga}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Orígenes del frontend (repositorio frontend-taganga-ui), separados por coma
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
